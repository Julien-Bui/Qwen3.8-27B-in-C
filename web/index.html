<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen 3.8-27B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="topbar">
      <button class="btn-new-chat" id="btnNewChat" title="Clear conversation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New Chat</span>
      </button>
      <div class="model-tag">Qwen 3.8-27B &bull; Local CPU</div>
    </header>

    <main class="chat-stream" id="chatStream">
      <div class="empty-state" id="emptyState">
        <h1>How can I help you today?</h1>
      </div>
    </main>

    <footer class="input-wrapper">
      <form class="input-box" id="chatForm">
        <textarea
          id="userInput"
          rows="1"
          placeholder="Message Qwen..."
          autofocus
        ></textarea>
        <button type="submit" class="btn-action" id="btnAction" aria-label="Send" disabled>
          <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
          <svg class="icon-stop hidden" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          </svg>
        </button>
      </form>
      <div class="input-hint">Pure C Inference (AVX2 + MTP Speculative Decoding)</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
